spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  application:
    name: LoopDeck
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loopdeck}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      # Toda sesión en UTC, como escribe Hibernate, sea cual sea la hora del servidor (en Docker, Madrid).
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mandatory-file-encoding: UTF-8

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

jwt:
  secret: ${JWT_SECRET}

# URL pública del frontend: se usa en los enlaces de los correos (recuperar contraseña).
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}

# Correo con Resend. Sin RESEND_API_KEY no se envía nada (solo se registra, sin datos personales).
resend:
  api-key: ${RESEND_API_KEY:}
mail:
  from: ${MAIL_FROM:LoopDeck <no-reply@raclos.es>}

# Llaves de acceso (WebAuthn): dominio al que quedan ligadas y orígenes desde los que se aceptan.
webauthn:
  rp-id: ${WEBAUTHN_RP_ID:loopdeck.raclos.es}
  origins: ${WEBAUTHN_ORIGINS:https://loopdeck.raclos.es}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    thinking-level: ${GEMINI_THINKING_LEVEL:medium}
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.5-flash-lite,gemini-3.6-flash}
    definition-model: ${GEMINI_DEFINITION_MODEL:gemini-3.5-flash-lite}

google:
  client-id: ${GOOGLE_CLIENT_ID:498045926443-f4bjit64ge5b2uqcfbismjkuf61uob13.apps.googleusercontent.com}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  capacity: ${RATE_LIMIT_CAPACITY:100}
  tokens: ${RATE_LIMIT_TOKENS:10}
  # Proxies delante de la app que añaden un salto a X-Forwarded-For (1 con un proxy de borde o nginx).
  trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}
