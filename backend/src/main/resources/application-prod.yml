server:
  address: 0.0.0.0

# En producción el enlace de los correos apunta por defecto al dominio real.
app:
  public-url: ${APP_PUBLIC_URL:https://loopdeck.raclos.es}

spring:
  datasource:
    # Sin valores por defecto: en producción el arranque falla si falta la base de datos.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

# La documentación de la API no se publica en producción.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
