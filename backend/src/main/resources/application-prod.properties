# ═══════════════════════════════════════════════════════════
# LoopDeck Backend — PRODUCTION (Railway)
# Todas las variables sensibles se inyectan como env vars
# ═══════════════════════════════════════════════════════════

spring.application.name=LoopDeck

# ── Database (PostgreSQL - Railway inyecta PGHOST etc.) ────
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# ── JPA ────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ─────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:LoopDeckProductionSuperSecretKeyThatIsLongEnough!!}
jwt.expiration=${JWT_EXPIRATION:2592000000}

# ── Server ─────────────────────────────────────────────────
server.port=${PORT:8080}

# ── CORS ───────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:*}

# ── Jackson ────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# -- IA (Gemini) ---------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}

# -- Google OAuth --------------------------------------------
google.client.id=${GOOGLE_CLIENT_ID:498045926443-f4bjit64ge5b2uqcfbismjkuf61uob13.apps.googleusercontent.com}
