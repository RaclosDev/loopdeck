name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test change selection
        run: node --test scripts/ci-scope.test.mjs
      - name: Select affected checks
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
          else
            printf '__unknown_change__\0' | node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
          fi

  backend-build-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: loopdeck
          POSTGRES_PASSWORD: loopdeck_test_password
          POSTGRES_DB: loopdeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and Test Backend
        working-directory: ./backend
        run: ./mvnw -DargLine=-Dapi.version=1.44 clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/loopdeck_test
          SPRING_DATASOURCE_USERNAME: loopdeck
          SPRING_DATASOURCE_PASSWORD: loopdeck_test_password
          JWT_SECRET: test_secret_key_that_is_at_least_32_bytes_long

  frontend-build-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm run test

      - name: Build Production App
        working-directory: ./frontend
        run: npm run build

      - name: Install Chromium headless shell
        working-directory: ./frontend
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser Regression Tests
        working-directory: ./frontend
        run: npm run e2e

  docker-build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -t loopdeck:ci .
