name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: loopdeck
          POSTGRES_PASSWORD: loopdeck_test_password
          POSTGRES_DB: loopdeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and Test Backend
        working-directory: ./backend
        run: ./mvnw clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/loopdeck_test
          SPRING_DATASOURCE_USERNAME: loopdeck
          SPRING_DATASOURCE_PASSWORD: loopdeck_test_password
          JWT_SECRET: test_secret_key_that_is_at_least_32_bytes_long

  frontend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
          
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm run test
        
      - name: Build Production App
        working-directory: ./frontend
        run: npm run build
