    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://loopdeck.raclos.es/#website",
            "name": "LoopDeck",
            "url": "https://loopdeck.raclos.es/",
            "inLanguage": "es"
          },
          {
            "@type": "WebApplication",
            "name": "LoopDeck",
            "url": "https://loopdeck.raclos.es/",
            "applicationCategory": "EducationalApplication",

    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoopDeck" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/png" href="/loopdeck-brush-192.png" sizes="192x192" />

    <link rel="manifest" href="/manifest.json" />
    <title>LoopDeck · Tarjetas de estudio con repetición espaciada, gratis</title>
    <!-- Pinta el fondo antes de que lleguen el CSS y el JS, y muestra el icono solo si el arranque tarda. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0f172a;
      }
      html.boot-light,
      html.boot-light body {
        background: #d4d0c5;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: inherit;
        transition: opacity 200ms ease;
      }
      html.boot-light #boot-splash {
        background: #d4d0c5;
      }
      html:not(.boot-light) #boot-splash {
        background: #0f172a;
      }
      #boot-splash img {
        width: 72px;
        height: 72px;
        opacity: 0;
        animation: boot-splash-in 200ms ease 500ms forwards;
      }
      #boot-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes boot-splash-in {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-splash img {
          transition: none;
          animation: none;
        }
      }
    </style>
    <script>
      try {
        if (localStorage.getItem('loopdeck_theme') === 'light') {
          document.documentElement.classList.add('boot-light');
        }
      } catch (e) {
        /* almacenamiento no disponible: se queda el fondo oscuro */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true"><img src="/loopdeck-brush-192.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
